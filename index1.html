<!DOCTYPE html>
  <head>
    <title>Fonki Chat Widget</title>
    <script src="webchat.js"></script>
  </head>
  <body style="background-color: azure;">
    <div id="webchat-container" style="position: fixed;"></div>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        if (window.renderWebchat && typeof window.renderWebchat.renderWebchat === 'function') {
          window.renderWebchat.renderWebchat('webchat-container', {
            brandColor: 'blue',
            accentColor: 'blue',
            fontFamily: 'Arial',
            bubblePosition: 'end',
            widgetWidth: '25',
            widgetHeight: '40',
            position: 'fixed',
            botKey: 1,
            fonkiHost: 'https://fonki-stage.azurewebsites.net',
          });
        } else {
          console.error('renderWebchat or renderWebchat.renderWebchat is undefined');
        }
      });
    </script>
  </body>
</html>
